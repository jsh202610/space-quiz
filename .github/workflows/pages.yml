name: Test and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and prepare site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/tests/quiz.test.html > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/tests/quiz.test.html > /dev/null
          timeout 60s google-chrome --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=10000 --dump-dom \
            http://127.0.0.1:8000/tests/quiz.test.html > "$RUNNER_TEMP/browser-tests.html"
          if ! grep -q '<title>PASS - Quiz browser tests</title>' "$RUNNER_TEMP/browser-tests.html"; then
            cat "$RUNNER_TEMP/browser-tests.html"
            exit 1
          fi

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
